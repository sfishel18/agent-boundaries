name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd opencode && bun install --frozen-lockfile

      - name: Run tests
        run: cd opencode && bun run test

      - name: Generate test report
        if: always()
        run: |
          echo "Test run completed on $(date)" >> $GITHUB_STEP_SUMMARY
